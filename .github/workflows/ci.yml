name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core 3.3.12 and NimBLE 2.5.1
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "NimBLE-Arduino@2.5.1"
      - name: Build N16R8 merged firmware
        run: hardware/build_firmware.sh
      - name: Host tests for the pure C firmware pieces
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          make -C hardware/tests
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-n16r8-merged
          path: hardware/dist/esp32s3-n16r8-merged.bin
          if-no-files-found: error

  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,mcp]"
      - name: Ruff
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: ruff check .
      - name: Pytest
        run: pytest -q
        env:
          HIDAGENT_DATA: ${{ runner.temp }}/hidagent-test

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PowerShell parses every script and this job is not a Linux subsystem
        shell: pwsh
        run: |
          if ($env:WSL_DISTRO_NAME) { throw "this job is inside a Linux subsystem" }
          $env:PYTHONUTF8 = "1"
          python -c "import sys; assert sys.platform == 'win32'"
          $files = Get-ChildItem -Path scripts, hardware -Filter *.ps1
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "parse failed: $($file.FullName)"
            }
            Write-Output "parsed $($file.Name)"
          }
          python scripts/setup.py --help
          if ($LASTEXITCODE -ne 0) { throw "setup help failed" }
          python scripts/flash.py --help
          if ($LASTEXITCODE -ne 0) { throw "flash help failed" }
          python scripts/wifi_config.py --help
          if ($LASTEXITCODE -ne 0) { throw "wifi help failed" }
