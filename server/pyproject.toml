[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-iphone-agent-hybrid"
version = "0.2.0"
description = "Control a real iPhone from MCP agents via ESP32-S3 USB HID and onboard AirPlay (TCP 7201)"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pillow>=10",
    "pypinyin>=0.53,<1",
    "pyserial>=3.5",
    "av>=14",
    "esptool>=4.7,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
mcp = ["mcp>=1.2,<2"]
ocr = ["rapidocr-onnxruntime==1.4.4"]

[project.scripts]
iphone-agent = "hidagent.cli:main"

[project.urls]
Homepage = "https://github.com/se7en-Go/esp32-iphone-agent-hybrid"

[tool.setuptools]
packages = ["hidagent"]

[tool.setuptools.package-data]
hidagent = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701"]  # one-line `case` arms keep the action dispatch compact

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: real OCR fixture tests requiring the optional ocr extra"]
